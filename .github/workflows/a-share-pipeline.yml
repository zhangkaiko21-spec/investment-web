name: A-share Box Strategy Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - intraday
          - decision
          - close
  push:
    branches: [main]
    paths:
      - market_data/**
      - .github/workflows/a-share-pipeline.yml
  schedule:
    # Beijing time: 09:35, 10:35, 13:35, 14:35, 14:50 on A-share weekdays.
    - cron: '35 1 * * 1-5'
    - cron: '35 2 * * 1-5'
    - cron: '35 5 * * 1-5'
    - cron: '35 6 * * 1-5'
    - cron: '50 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: a-share-box-pipeline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_data/requirements.txt

      - name: Install dependencies
        run: pip install -r market_data/requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: .cache/a_share_history.json
          key: a-share-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a-share-history-${{ runner.os }}-

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="bootstrap"
          elif [[ "${{ github.event.schedule }}" == "50 6 * * 1-5" ]]; then
            MODE="decision"
          else
            MODE="intraday"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Run multi-source A-share pipeline
        run: python market_data/a_share_pipeline.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Validate generated JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = ['health.json', 'market_summary.json', 'candidates.json', 'decision.json', 'account_state.json']
          base = Path('data/a_share')
          for name in required:
              path = base / name
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              json.loads(path.read_text(encoding='utf-8'))
          health = json.loads((base / 'health.json').read_text(encoding='utf-8'))
          if not health.get('ok'):
              raise SystemExit(f'data health failed: {health}')
          print('JSON validation passed')
          PY

      - name: Publish latest results
        shell: bash
        run: |
          git config user.name "a-share-strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/a_share
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh A-share strategy results [skip ci]"
            git push
          fi
