name: A-share Box Strategy Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: intraday
        type: choice
        options:
          - bootstrap
          - intraday
          - decision
          - close
  push:
    branches: [main]
    paths:
      - market_data/a_share_pipeline.py
      - market_data/a_share_pipeline_v2.py
      - market_data/a_share_pipeline_v3.py
      - market_data/strategy_config.json
      - market_data/trigger.json
      - .github/workflows/a-share-pipeline.yml
  schedule:
    # Native backups in UTC. Beijing: 09:20, 10:20, 13:20, 14:20,
    # 14:40 and 14:46 tail decisions, then 16:20 history maintenance.
    # The ChatGPT exact trigger remains an additional independent path.
    - cron: '20 1 * * 1-5'
    - cron: '20 2 * * 1-5'
    - cron: '20 5 * * 1-5'
    - cron: '20 6 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '46 6 * * 1-5'
    - cron: '20 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: a-share-box-pipeline
  # Queue overlapping backups instead of cancelling a valid tail decision.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_data/requirements.txt

      - name: Install dependencies
        run: pip install -r market_data/requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: .cache/a_share_history.json
          key: a-share-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a-share-history-${{ runner.os }}-

      - name: Resolve run mode
        id: mode
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$HEAD_COMMIT_MESSAGE" == trigger:* ]] && [[ -f market_data/trigger.json ]]; then
              MODE=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('market_data/trigger.json').read_text(encoding='utf-8'))
          mode = data.get('mode', 'intraday')
          print(mode if mode in {'bootstrap', 'intraday', 'decision', 'close'} else 'intraday')
          PY
              )
            else
              MODE="bootstrap"
            fi
          elif [[ "${{ github.event.schedule }}" == "20 8 * * 1-5" ]]; then
            MODE="bootstrap"
          elif [[ "${{ github.event.schedule }}" == "40 6 * * 1-5" ]] || [[ "${{ github.event.schedule }}" == "46 6 * * 1-5" ]]; then
            MODE="decision"
          else
            MODE="intraday"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Requested mode: $MODE"

      - name: Run time-safe pipeline with retries
        id: pipeline
        shell: bash
        run: |
          mkdir -p data/a_share
          set +e
          EXIT_CODE=1
          for ATTEMPT in 1 2; do
            echo "Pipeline attempt $ATTEMPT/2"
            python market_data/a_share_pipeline_v3.py --mode "${{ steps.mode.outputs.mode }}" 2>&1 | tee data/a_share/run.log
            EXIT_CODE=${PIPESTATUS[0]}
            if [[ "$EXIT_CODE" -eq 0 ]]; then
              break
            fi
            sleep $((ATTEMPT * 15))
          done
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ ! -f data/a_share/health.json ]]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          cn = timezone(timedelta(hours=8))
          log = Path('data/a_share/run.log')
          payload = {
              'ok': False,
              'pipeline_ok': False,
              'trade_allowed': False,
              'status': 'pipeline_crashed',
              'generated_at': datetime.now(cn).isoformat(timespec='seconds'),
              'error': log.read_text(encoding='utf-8', errors='replace')[-12000:] if log.exists() else 'no log generated',
          }
          Path('data/a_share/health.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          fi
          exit 0

      - name: Publish JSON results safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "a-share-strategy-bot"
          git config user.email "actions@users.noreply.github.com"

          SNAPSHOT_DIR=$(mktemp -d)
          cp data/a_share/*.json "$SNAPSHOT_DIR"/

          PUBLISHED=0
          for ATTEMPT in 1 2 3; do
            echo "Publish attempt $ATTEMPT/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/a_share
            cp "$SNAPSHOT_DIR"/*.json data/a_share/
            git add data/a_share/*.json

            if git diff --cached --quiet; then
              echo "No JSON data changes"
              PUBLISHED=1
              break
            fi

            git commit -m "data: refresh A-share strategy results [skip ci]"
            if git push origin HEAD:main; then
              PUBLISHED=1
              break
            fi

            echo "Remote advanced while publishing; retrying from latest main"
            sleep $((ATTEMPT * 5))
          done

          if [[ "$PUBLISHED" -ne 1 ]]; then
            echo "Failed to publish JSON results after retries" >&2
            exit 1
          fi

      - name: Enforce pipeline health and ledger gate
        if: always()
        shell: bash
        env:
          PIPELINE_EXIT_CODE: ${{ steps.pipeline.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ['health.json', 'market_summary.json', 'candidates.json', 'decision.json', 'account_state.json']
          base = Path('data/a_share')
          missing = [name for name in required if not (base / name).exists()]
          if missing:
              raise SystemExit(f'missing generated files: {missing}')

          payloads = {}
          for name in required:
              payloads[name] = json.loads((base / name).read_text(encoding='utf-8'))

          health = payloads['health.json']
          decision = payloads['decision.json']
          account = payloads['account_state.json']

          if os.environ.get('PIPELINE_EXIT_CODE') != '0':
              raise SystemExit(f"pipeline failed after retries; diagnostic health={health}")
          if not health.get('pipeline_ok', health.get('ok')):
              raise SystemExit(f'pipeline health failed: {health}')
          if not health.get('invariants_ok'):
              raise SystemExit(f'ledger invariants were not validated: {health}')
          if decision.get('account_summary', {}).get('equity') != account.get('equity'):
              raise SystemExit('decision/account equity mismatch')
          if decision.get('actions') and not health.get('trade_allowed'):
              raise SystemExit('actions exist while trading is disallowed')

          if health.get('requested_mode') in {'decision', 'close'} and decision.get('effective_mode') in {'decision', 'close'}:
              tail_path = base / 'tail_snapshot.json'
              if not tail_path.exists():
                  raise SystemExit('valid tail run did not create tail_snapshot.json')
              tail = json.loads(tail_path.read_text(encoding='utf-8'))
              if tail.get('market_date') != health.get('market_date') or not tail.get('snapshot_valid'):
                  raise SystemExit(f'invalid locked tail snapshot: {tail}')

          print('Pipeline, JSON, tail snapshot and unique-ledger validation passed')
          PY
