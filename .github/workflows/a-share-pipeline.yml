name: A-share Box Strategy Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - intraday
          - decision
          - close
  push:
    branches: [main]
    paths:
      - market_data/**
      - .github/workflows/a-share-pipeline.yml
  schedule:
    # Beijing time: 09:35, 10:35, 13:35, 14:35, 14:50 on A-share weekdays.
    - cron: '35 1 * * 1-5'
    - cron: '35 2 * * 1-5'
    - cron: '35 5 * * 1-5'
    - cron: '35 6 * * 1-5'
    - cron: '50 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: a-share-box-pipeline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_data/requirements.txt

      - name: Install dependencies
        run: pip install -r market_data/requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: .cache/a_share_history.json
          key: a-share-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a-share-history-${{ runner.os }}-

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="bootstrap"
          elif [[ "${{ github.event.schedule }}" == "50 6 * * 1-5" ]]; then
            MODE="decision"
          else
            MODE="intraday"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Run pipeline with retries and diagnostics
        id: pipeline
        shell: bash
        run: |
          mkdir -p data/a_share
          set +e
          EXIT_CODE=1
          for ATTEMPT in 1 2 3; do
            echo "Pipeline attempt $ATTEMPT/3"
            python market_data/a_share_pipeline.py --mode "${{ steps.mode.outputs.mode }}" 2>&1 | tee data/a_share/run.log
            EXIT_CODE=${PIPESTATUS[0]}
            if [[ "$EXIT_CODE" -eq 0 ]]; then
              break
            fi
            sleep $((ATTEMPT * 20))
          done
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ ! -f data/a_share/health.json ]]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          cn = timezone(timedelta(hours=8))
          log = Path('data/a_share/run.log')
          payload = {
              'ok': False,
              'status': 'pipeline_crashed',
              'generated_at': datetime.now(cn).isoformat(timespec='seconds'),
              'error': log.read_text(encoding='utf-8', errors='replace')[-12000:] if log.exists() else 'no log generated',
          }
          Path('data/a_share/health.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          fi
          exit 0

      - name: Publish results and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "a-share-strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/a_share
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh A-share strategy results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce health gate
        if: always()
        shell: bash
        env:
          PIPELINE_EXIT_CODE: ${{ steps.pipeline.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          required = ['health.json', 'market_summary.json', 'candidates.json', 'decision.json', 'account_state.json']
          base = Path('data/a_share')
          missing = [name for name in required if not (base / name).exists()]
          if missing:
              raise SystemExit(f'missing generated files: {missing}')
          for name in required:
              json.loads((base / name).read_text(encoding='utf-8'))
          health = json.loads((base / 'health.json').read_text(encoding='utf-8'))
          if os.environ.get('PIPELINE_EXIT_CODE') != '0':
              raise SystemExit(f"pipeline failed after retries; diagnostic health={health}")
          if not health.get('ok'):
              raise SystemExit(f'data health failed: {health}')
          print('Pipeline and JSON health validation passed')
          PY
